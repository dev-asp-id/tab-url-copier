<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Tab URL Copier</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      body {
        width: 320px;
        padding: 16px;
        background-color: #ffffff;
        color: #1f2937;
        font-size: 13px;
      }

      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
        padding-bottom: 10px;
        border-bottom: 1px solid #e5e7eb;
      }

      .header-icon {
        width: 24px;
        height: 24px;
        color: #2563eb;
        flex-shrink: 0;
      }

      .header h1 {
        font-size: 15px;
        font-weight: 700;
        color: #111827;
        line-height: 1.2;
      }

      .header p {
        font-size: 11px;
        color: #6b7280;
      }

      .form-group {
        margin-bottom: 12px;
      }

      label {
        display: block;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 12px;
        color: #374151;
      }

      select,
      input[type="text"] {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        background-color: #f9fafb;
        font-size: 12.5px;
        outline: none;
        transition: all 0.15s ease;
      }

      select:focus,
      input[type="text"]:focus {
        border-color: #2563eb;
        background-color: #ffffff;
        box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15);
      }

      .btn-copy {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        width: 100%;
        background-color: #2563eb;
        color: #ffffff;
        border: none;
        border-radius: 6px;
        padding: 9px;
        font-weight: 600;
        font-size: 13px;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .btn-copy:hover {
        background-color: #1d4ed8;
      }

      .btn-copy:active {
        background-color: #1e40af;
      }

      .btn-icon {
        width: 16px;
        height: 16px;
        fill: currentColor;
      }

      .status-msg {
        margin-top: 8px;
        font-size: 11.5px;
        color: #16a34a;
        font-weight: 600;
        text-align: center;
      }

      .hidden {
        display: none;
      }

      .footer {
        margin-top: 14px;
        padding-top: 10px;
        border-top: 1px solid #f3f4f6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 11px;
        color: #6b7280;
      }

      .footer a {
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }

      .footer a:hover {
        text-decoration: underline;
      }

      .github-icon {
        width: 12px;
        height: 12px;
        fill: currentColor;
      }
    </style>
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <svg
        class="header-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path
          d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
        ></path>
        <path
          d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
        ></path>
      </svg>
      <div>
        <h1 data-i18n="appName">Tab URL Copier</h1>
        <p data-i18n="headerSubtitle">Quickly export all open URLs</p>
      </div>
    </div>

    <!-- Form controls -->
    <div class="form-group">
      <label for="separator" data-i18n="labelSeparator">Separator:</label>
      <select id="separator">
        <option value="newline" data-i18n="optNewline">Newline (Enter)</option>
        <option value="semicolon" data-i18n="optSemicolon">
          Semicolon (;)
        </option>
        <option value="comma" data-i18n="optComma">Comma (,)</option>
        <option value="space" data-i18n="optSpace">Space ( )</option>
        <option value="custom" data-i18n="optCustom">Custom...</option>
      </select>
    </div>

    <div id="custom-input-container" class="form-group hidden">
      <label for="custom-separator" data-i18n="labelCustom"
        >Custom Separator:</label
      >
      <input type="text" id="custom-separator" placeholder="e.g. | or - " />
    </div>

    <button id="copy-btn" class="btn-copy">
      <svg
        class="btn-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path
          d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
        ></path>
      </svg>
      <span data-i18n="btnCopy">Copy All Tab URLs</span>
    </button>

    <p id="status-msg" class="status-msg hidden" data-i18n="msgCopied">
      ✓ URLs copied to clipboard!
    </p>

    <!-- Footer -->
    <div class="footer">
      <span data-i18n="footerMadeWith">Made with ♥ </span>
      <a
        href="https://github.com/USERNAME/tab-url-copier"
        target="_blank"
        id="repo-link"
      >
        <svg class="github-icon" viewBox="0 0 24 24">
          <path
            d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"
          />
        </svg>
        GitHub
      </a>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
